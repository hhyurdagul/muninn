name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and test
        run: nix build -L
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Format
        run: nix develop -c cargo fmt --all --check
