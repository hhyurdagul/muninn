[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
muninn-ai = { path = "crates/ai" }
muninn-agent = { path = "crates/agent" }
muninn-mcp = { path = "crates/mcp" }
muninn-core = { path = "crates/core" }
muninn-tui = { path = "crates/tui" }
muninn-vault = { path = "crates/vault" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
parking_lot = "0.12"
futures = "0.3"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "net", "process", "fs"] }
tokio-util = "0.7"
toml = "0.8"
unicode-width = "0.2"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
